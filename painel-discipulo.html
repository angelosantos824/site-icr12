<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Painel do Discípulo | ICR12MPU</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

  <!-- Script principal -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- MAIN -->
  <main class="section container">

    <section class="page-card glass">

      <p class="eyebrow">Carteira M12</p>

      <h1>Painel do Discípulo</h1>

      <div class="cards-grid">

        <!-- CARD DO DISCÍPULO -->
        <article class="card">

          <h3 id="cartao-nome">
            Nome do discípulo
          </h3>

          <p id="cartao-cargo">
            Cargo / função
          </p>

          <p>
            <strong>Código:</strong>

            <span id="cartao-codigo">
              ---
            </span>
          </p>

        </article>

      </div>

      <!-- BOTÃO -->
      <div class="actions">

        <a
          class="btn secondary"
          href="index.html"
        >
          Voltar ao site
        </a>

      </div>

    </section>

  </main>

</body>

</html>
