<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Painel do Discípulo | ICR12MPU</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js" defer></script>
</head>

<body>

  <main class="section container">

    <section class="page-card glass">

      <p class="eyebrow">Carteira M12</p>

      <h1>Painel do Discípulo</h1>

      <div class="cards-grid">

        <article class="card">
          <h3 id="cartao-nome">Carregando...</h3>

          <p>
            <strong>Email:</strong>
            <span id="cartao-email">---</span>
          </p>

          <p>
            <strong>Cargo:</strong>
            <span id="cartao-cargo">---</span>
          </p>

          <p>
            <strong>Código M12:</strong>
            <span id="cartao-codigo">---</span>
          </p>
        </article>

      </div>

      <div class="actions">
        <button class="btn secondary" type="button" id="logout-btn">
          Sair
        </button>

        <a class="btn secondary" href="index.html">
          Voltar ao site
        </a>
      </div>

    </section>

  </main>

</body>

</html>
