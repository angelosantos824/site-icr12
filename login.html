<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICR12 - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-wrapper">
        <div class="glass-box login-container">
            <div class="logo-login">
                <img src="Imagens/logoapp.jpeg" alt="ICR Logo">
            </div>
            
            <h2 class="title-gold">Acesso Restrito</h2>
            <p class="subtitle">Área de Membros e Liderança</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="login-footer">
                <a href="index.html">Voltar para a Home</a>
            </div>
        </div>
    </main>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
